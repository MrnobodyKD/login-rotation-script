<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Monitor - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f1923;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: #1a2733;
            padding: 40px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid #2a3a4a;
        }
        .login-box h2 {
            color: #e0e0e0;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: #0f1923;
            border: 1px solid #2a3a4a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .login-box input:focus { border-color: #4a9eff; }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .login-box button:hover { background: #3a8eef; }
        .error {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 16px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>MT5 Monitor</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
